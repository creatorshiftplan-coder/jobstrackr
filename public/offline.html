<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Jobstrackr</title>
  <style>
    :root {
      --primary: #0A4174;
      --primary-hover: #072f54;
      --background: #f8fafc;
      --foreground: #0f172a;
      --card: #ffffff;
      --card-foreground: #1e293b;
      --muted-foreground: #64748b;
      --border: #e2e8f0;
      --ring: rgba(10, 65, 116, 0.2);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0f172a;
        --foreground: #f8fafc;
        --card: #1e293b;
        --card-foreground: #f1f5f9;
        --muted-foreground: #94a3b8;
        --border: #334155;
        --ring: rgba(14, 165, 233, 0.3);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--background);
      color: var(--foreground);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-w: 420px;
      width: 100%;
      text-align: center;
      padding: 2.5rem 2rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    .icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background-color: rgba(10, 65, 116, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }

    @media (prefers-color-scheme: dark) {
      .icon-wrapper {
        background-color: rgba(14, 165, 233, 0.15);
        color: #38bdf8;
      }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      color: var(--foreground);
      letter-spacing: -0.025em;
    }

    p {
      font-size: 0.925rem;
      line-height: 1.5;
      color: var(--muted-foreground);
      margin-bottom: 1.75rem;
    }

    .offline-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.375rem 0.875rem;
      background-color: #fef3c7;
      color: #92400e;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      border: 1px solid #fde68a;
    }

    @media (prefers-color-scheme: dark) {
      .offline-badge {
        background-color: rgba(245, 158, 11, 0.15);
        color: #fbbf24;
        border-color: rgba(245, 158, 11, 0.3);
      }
    }

    .feature-list {
      text-align: left;
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1rem;
      margin-bottom: 1.75rem;
    }

    @media (prefers-color-scheme: dark) {
      .feature-list {
        background: rgba(255, 255, 255, 0.02);
      }
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--card-foreground);
      margin-bottom: 0.5rem;
    }

    .feature-item:last-child {
      margin-bottom: 0;
    }

    .feature-icon {
      font-size: 1rem;
    }

    .btn {
      width: 100%;
      padding: 0.875rem;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(10, 65, 116, 0.15);
      transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:focus {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="offline-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
      Offline Mode
    </div>

    <div class="icon-wrapper">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.5"></path>
        <path d="M5 12.5a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>Internet Disconnected</h1>
    <p>You are offline. Some features may be unavailable until your network connection is restored.</p>

    <div class="feature-list">
      <div class="feature-item">
        <span class="feature-icon">✅</span>
        <span>Browse cached job lists and search results</span>
      </div>
      <div class="feature-item">
        <span class="feature-icon">✅</span>
        <span>View and update your active exam tracker</span>
      </div>
      <div class="feature-item">
        <span class="feature-icon">✅</span>
        <span>Access saved applications and offline details</span>
      </div>
    </div>

    <button class="btn" onclick="window.location.reload()">Try Reconnecting</button>
  </div>
</body>
</html>
